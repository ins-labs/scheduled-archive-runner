name: Slot 2 probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slot-2-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, nf-outage]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Feasibility probe
        env:
          SLOT_2_PROBE_URL: ${{ secrets.SLOT_2_PROBE_URL }}
        run: node slot2_probe.cjs
