name: Archive verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-operation
  cancel-in-progress: false
jobs:
  verify:
    if: vars.RUN_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: npm ci --ignore-scripts --omit=dev --silent
      - name: Synthetic checks
        run: npm test
      - name: Tool preparation
        env:
          PRIVATE_CONFIGURATION: ${{ secrets.PRIVATE_CONFIGURATION }}
        run: node tools.cjs
      - name: Private operation
        env:
          PRIVATE_CONFIGURATION: ${{ secrets.PRIVATE_CONFIGURATION }}
          SOURCE_IDENTITY: ${{ secrets.SOURCE_IDENTITY }}
          SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          REMOTE_IDENTITY: ${{ secrets.REMOTE_IDENTITY }}
          REMOTE_KEY: ${{ secrets.REMOTE_KEY }}
          MONGODUMP: /tmp/archive-tools/bin/mongodump
          MONGORESTORE: /tmp/archive-tools/bin/mongorestore
        run: node launch.cjs
