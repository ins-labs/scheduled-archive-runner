name: Slot watch
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: slot-watch
  cancel-in-progress: false
jobs:
  watch:
    strategy:
      fail-fast: false
      matrix:
        slot: ['1', '2', '3']
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned age (sha256-verified)
        run: |
          curl -sSL -o /tmp/age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          echo "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  /tmp/age.tar.gz" | sha256sum -c -
          tar xzf /tmp/age.tar.gz -C /tmp
      - name: Run slot
        env:
          SLOT_CONFIG_JSON: ${{ secrets[format('SLOT_{0}_CONFIG', matrix.slot)] }}
          SLOT_STATE_DIR: snapshots
        run: python3 engine/run_slot_cli.py
      - name: Commit changed snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: AUTHORIZATION: basic placeholder
        run: |
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          if [ -n "$(git status --porcelain snapshots/)" ]; then
            git config user.name "slot-watch"
            git config user.email "slot-watch@localhost"
            git add snapshots/
            git commit -m "slot ${{ matrix.slot }}: snapshot update"
            ok=0
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && ok=1 && break
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "push failed after 3 attempts"; exit 1; }
          else
            echo "no snapshot change"
          fi
